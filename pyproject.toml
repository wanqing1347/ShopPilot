[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppilot-agent"
version = "0.12.0"
description = "ShopPilot: a cross-platform e-commerce search and decision Agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0,<1.0.0",
  "langchain>=1.3.0,<2.0.0",
  "langgraph>=1.1.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
  "aiosqlite>=0.21.0,<1.0.0",
  "langchain-openai>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
web = [
  "tavily-python>=0.7.0",
]
observability = [
  "langfuse>=4.0.0,<5.0.0",
]
postgres = [
  "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
]
retrieval = [
  "numpy>=2.0.0,<3.0.0",
  "faiss-cpu>=1.10.0,<2.0.0",
]
embedding = [
  "sentence-transformers>=5.0.0,<6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "output*", "frontend*", "tests*", "scripts*"]

[tool.setuptools.package-data]
"app.recall" = ["artifacts/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
